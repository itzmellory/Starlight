plugins {
    id 'java'
}
group = 'starlight'
version = '1.0'
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
dependencies {
    compileOnly "com.github.Anuken.Mindustry:core:${mindustryVersion}"
}
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/java/starlight/resources']
        }
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
task jarAndroid {
    dependsOn 'jar'
    doLast {
        def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException("ANDROID_HOME is not set or does not exist.")
        }
        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f ->
            new File(f, "android.jar").exists()
        }
        if (!platformRoot) {
            throw new GradleException("No android.jar found in Android SDK platforms.")
        }
        def buildToolsRoot = new File("$sdkRoot/build-tools/").listFiles().sort().reverse().find { f ->
            new File(f, "d8").exists() || new File(f, "d8.bat").exists()
        }
        if (!buildToolsRoot) {
            throw new GradleException("No d8 found in Android SDK build-tools.")
        }
        def d8 = new File(buildToolsRoot, System.getProperty("os.name").toLowerCase().contains("windows") ? "d8.bat" : "d8")
        def dependencies = (configurations.compileClasspath.asList() + [new File(platformRoot, "android.jar")]).collect { "--classpath \"$it.path\"" }.join(" ")
        exec {
            workingDir "$buildDir/libs"
            commandLine "sh", "-c", "\"$d8\" $dependencies --min-api 14 --output ${project.name}Android.jar ${project.name}-${project.version}.jar"
        }
    }
}
jar {
    archiveFileName = "${project.name}-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('mod.hjson')
    from('icon.png')
}
task deploy(type: Jar) {
    dependsOn 'jarAndroid'
    dependsOn 'jar'
    archiveFileName = "Starlight.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        [
            zipTree("$buildDir/libs/${project.name}-${project.version}.jar"),
            zipTree("$buildDir/libs/${project.name}Android.jar")
        ]
    }
    doLast {
        delete "$buildDir/libs/${project.name}-${project.version}.jar"
        delete "$buildDir/libs/${project.name}Android.jar"
    }
}
