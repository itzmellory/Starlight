name: Auto Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="v1.0"
          else
            MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
            MINOR=$((MINOR + 1))
            VERSION="v1.$MINOR"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Starlight ${{ steps.version.outputs.version }}" \
            --generate-notes
