name: Auto Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew clean deploy
      - name: Verify bundles
        run: |
          test -d src/main/java/starlight/resources/bundles
          jar tf build/libs/Starlight.jar > build/libs/jar-contents.txt
          grep -q '^bundles/bundle.properties$' build/libs/jar-contents.txt
          grep -q '^bundles/bundle_ru.properties$' build/libs/jar-contents.txt
          grep -q '^bundles/bundle_zh.properties$' build/libs/jar-contents.txt
      - id: version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="v1.0"
          else
            MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
            VERSION="v1.$((MINOR + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            build/libs/Starlight.jar \
            --target "${{ github.sha }}" \
            --title "Starlight ${{ steps.version.outputs.version }}" \
            --generate-notes
